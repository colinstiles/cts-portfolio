    <style>
        body {
            background: #f6f7fb;
            color: #374054;
        }

        .gallery-shell {
            max-width: 1440px;
            margin: 0 auto;
            padding: 40px 18px 56px;
        }


        .gallery-header { margin-bottom: 28px; }
        .gallery-header h1 { margin: 8px 0 16px; font-size: 32px; }
        .gallery-back { color: #374054; font-size: 14px; }
        .gallery-filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .gallery-filters a { padding: 6px 14px; border-radius: 999px; background: #fff; color: #374054; font-size: 14px; box-shadow: 0 2px 8px rgba(55, 64, 84, 0.1); text-decoration: none; }
        .gallery-filters a.active { background: #374054; color: #fff; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 24px;
            align-items: start;
        }

        .gallery-item {
            grid-column: span 4;
        }

        .gallery-item--wide {
            grid-column: span 6;
        }

        .gallery-item--stagger {
            margin-top: 38px;
        }

        .gallery-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 14px 38px rgba(55, 64, 84, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 44px rgba(55, 64, 84, 0.18);
        }

        .gallery-card a {
            display: block;
        }

        .gallery-frame {
            background: linear-gradient(180deg, #edf2f8 0%, #e5ebf4 100%);
            padding: 14px;
        }

        .gallery-frame img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
            object-position: center top;
            border-radius: 8px;
            background: #e9edf5;
        }

        .gallery-item--wide .gallery-frame img {
            height: 320px;
        }

        @media (max-width: 1199px) {
            .gallery-item,
            .gallery-item--wide {
                grid-column: span 6;
            }

            .gallery-item--stagger {
                margin-top: 24px;
            }
        }

        @media (max-width: 767px) {
            .gallery-shell {
                padding: 24px 14px 40px;
            }

            .gallery-grid {
                gap: 18px;
            }

            .gallery-item,
            .gallery-item--wide {
                grid-column: span 12;
            }

            .gallery-item--stagger {
                margin-top: 0;
            }

            .gallery-frame img,
            .gallery-item--wide .gallery-frame img {
                height: auto;
            }
        }
    </style>
</head>

    <script>
        (function () {
            var wanted = new URLSearchParams(window.location.search).get('collection') || 'all';
            var valid = document.querySelector('.gallery-filters [data-filter="' + wanted + '"]');
            if (!valid) { wanted = 'all'; }
            document.querySelectorAll('.gallery-item').forEach(function (el) {
                el.hidden = wanted !== 'all' && el.dataset.collection !== wanted;
            });
            document.querySelectorAll('.gallery-filters a').forEach(function (a) {
                a.classList.toggle('active', a.dataset.filter === wanted);
            });
            if (wanted !== 'all') { document.title = valid.textContent + ' | Map Gallery | Colin Stiles'; }
        })();
    </script>
